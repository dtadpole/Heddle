<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heddle</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in oklab, currentColor 20%, transparent); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; display: flex; height: 100vh; }
  /**
   * The sidebar's width is one custom property, read by the panel and by nothing else.
   *
   * The default lives here, so a reader without stored preferences gets 22rem, and the script only ever
   * overwrites the property — measurement and layout can therefore never disagree about which width is in
   * force, which is what happens when a script sets `style.width` on the panel and a stylesheet disagrees.
   */
  :root { --sidebar-width: 22rem; }
  aside { width: var(--sidebar-width); flex: none; border-right: 1px solid var(--line); overflow-y: auto; padding: .75rem; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  /**
   * The divider borrows the sidebar's border so the drag target is where the line already is, and widens its
   * hit area into the content with a transparent border rather than by pushing the layout around.
   */
  #gutter-left {
    flex: none;
    width: 5px;
    margin-left: -3px;
    cursor: col-resize;
    background: transparent;
    border: none;
    padding: 0;
    touch-action: none;
  }
  #gutter-left:hover, #gutter-left:focus-visible, #gutter-left[data-dragging='true'] {
    background: color-mix(in oklab, currentColor 25%, transparent);
    outline: none;
  }
  h1 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin: .25rem 0 .5rem; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: .4rem .5rem; border-radius: .35rem; cursor: pointer; }
  li:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  li[aria-current] { background: color-mix(in oklab, currentColor 14%, transparent); }
  .meta { opacity: .6; font-size: .78rem; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
  .turn { border-left: 3px solid var(--line); padding-left: .6rem; white-space: pre-wrap; }
  .turn.user { border-color: #4b8bf5; }
  .turn.assistant { border-color: #2fa36b; }
  .turn.reasoning { border-color: #b7791f; opacity: .85; }
  .turn.reasoning[open] [data-body] { font-style: italic; }
  details.turn > summary { cursor: pointer; font-size: .82rem; opacity: .75; list-style: none; }
  details.turn > summary::-webkit-details-marker { display: none; }
  details.turn > summary::before { content: '▸ '; }
  details.turn[open] > summary::before { content: '▾ '; }
  details.turn > [data-body] { margin-top: .35rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85em; }
  .turn.tool { border-color: #8b5cf6; font-family: ui-monospace, monospace; font-size: .85em; }
  .turn.denied { border-color: #d14343; color: #d14343; }
  nav#views { display: flex; gap: .25rem; padding: .5rem .75rem 0; border-bottom: 1px solid var(--line); }
  nav#views button { font: inherit; font-size: .82rem; padding: .3rem .7rem; background: none; border: 1px solid transparent; border-bottom: none; border-radius: .35rem .35rem 0 0; color: inherit; opacity: .6; cursor: pointer; }
  nav#views button[aria-current='true'] { opacity: 1; border-color: var(--line); background: color-mix(in oklab, currentColor 7%, transparent); }
  /**
   * `hidden` has to win over this file's own display rules.
   *
   * Measured: the Chat rows were still drawn above the ledger in the Trajectory view. `#log` sets
   * `display: flex` with an **id** selector, and the browser's `[hidden] { display: none }` is a type-level
   * default — so the id won, `hidden` did nothing, and both views were on screen at once. A view ring that
   * leaves the previous view visible is worse than no ring: it looks like the ledger has chat in it.
   *
   * `!important` is the honest tool here rather than a specificity race, because the rule's meaning is
   * "hidden means hidden" and every future display rule must lose to it.
   */
  [hidden] { display: none !important; }
  #ledger { flex: 1; overflow-y: auto; padding: .75rem 1rem 1rem; font-size: .85rem; }
  #ledger .summary { font-size: .8rem; opacity: .7; margin-bottom: .6rem; }
  #ledger .turn { border-left: 3px solid var(--line); margin: 0 0 .6rem; padding-left: .6rem; }
  /**
   * The turn header stays at the top of the pane while its records scroll under it.
   *
   * A ledger is long, and after a page of rows the reader no longer knows which turn they are in — which is
   * the same reason the timeline exists above it.
   */
  #ledger .turn > header { font-weight: 600; font-size: .8rem; position: sticky; top: -.75rem; background: canvas; padding: .2rem 0; z-index: 1; }
  #ledger .step { margin: .2rem 0 .3rem .6rem; padding-left: .6rem; border-left: 1px dashed var(--line); }
  #ledger .step > header { font-size: .78rem; opacity: .7; }
  #ledger details.record { margin: .1rem 0; }
  /**
   * A record's row is exactly one line, truncated with an ellipsis, and opens on click.
   *
   * DSH's trajectory rows do this — `text-overflow: ellipsis` with `white-space: nowrap` on the row, and
   * `min-width: 0` on the flexible child — and the last part is the one that is easy to miss: without it a
   * flex item refuses to shrink below its content, so instead of being clipped the row pushes its siblings
   * out of the pane. A ledger of long tool arguments is otherwise unreadable and unnavigable.
   */
  #ledger details.record > summary {
    cursor: pointer;
    font-size: .8rem;
    display: flex;
    gap: .5rem;
    align-items: baseline;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.35;
  }
  /**
   * The row's layout, and the three declarations that had to be right together.
   *
   * Measured in a browser, three times, each failure looking like success:
   *
   * 1. written as a descendant selector the label computed `text-overflow: clip`, so a long label was cut
   *    mid-letter with nothing saying it continued;
   * 2. as a class it computed `ellipsis` but `flex-shrink: 0`, because a sibling rule set `flex: none` on
   *    every child — and an item that may not shrink grows past the row instead of truncating, so the
   *    ellipsis was never needed and never drawn (`label.clientWidth` was 4028px in a 1016px row);
   * 3. with `flex: 1 1 auto` on the label and no `flex` rule on its siblings, the row holds one line and
   *    the label truncates with a visible ellipsis.
   *
   * The three parts are load-bearing together: the label is the only flexible child, it may shrink, and
   * what does not fit ends in an ellipsis.
   */
  #ledger details.record > summary > .label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #ledger details.record[data-inflight='true'] > summary::after { content: ' · running'; color: #b7791f; }
  /**
   * The kind annotation, as DSH's rows carry one: a small, coloured, fixed-width badge so a reader can
   * scan a ledger for "which of these was the tool" without reading the labels.
   */
  #ledger .kind {
    font-family: ui-monospace, monospace;
    font-size: .72rem;
    min-width: 5.5rem;
    padding: .05rem .3rem;
    border-radius: .2rem;
    text-align: center;
    background: color-mix(in oklab, currentColor 10%, transparent);
    opacity: .9;
  }
  #ledger details.record[data-kind='user'] > summary > .kind { background: color-mix(in oklab, #4b8bf5 28%, transparent); }
  #ledger details.record[data-kind='assistant'] > summary > .kind { background: color-mix(in oklab, #2fa36b 28%, transparent); }
  #ledger details.record[data-kind='reasoning'] > summary > .kind { background: color-mix(in oklab, #b7791f 28%, transparent); }
  #ledger details.record[data-kind='tool'] > summary > .kind { background: color-mix(in oklab, #8b5cf6 28%, transparent); }
  #ledger details.record[data-kind='compaction'] > summary > .kind { background: color-mix(in oklab, #d14343 24%, transparent); }
  /**
   * The timeline: a proportional band of the session's recorded span, one pickable segment per turn.
   *
   * It is the same idea as the overview above DSH's ledger — real timing projected left to right, and
   * picking an interval takes the reader to it — reduced to what heddle's events support: turns as segments,
   * positioned by their own start and duration, coloured by what they did. A pick scrolls the ledger to that
   * turn, which is the whole point: a long ledger is otherwise navigated by scrolling and hoping.
   */
  #timeline { position: relative; height: 1.6rem; margin: .1rem 0 .7rem; border-radius: .25rem; background: color-mix(in oklab, currentColor 7%, transparent); overflow: hidden; }
  #timeline:empty { display: none; }
  #timeline button { position: absolute; top: 0; bottom: 0; padding: 0; border: none; border-right: 1px solid var(--line); background: color-mix(in oklab, #4b8bf5 45%, transparent); cursor: pointer; }
  #timeline button[data-leading='assistant'] { background: color-mix(in oklab, #2fa36b 45%, transparent); }
  #timeline button[data-leading='reasoning'] { background: color-mix(in oklab, #b7791f 45%, transparent); }
  #timeline button[data-leading='tool'] { background: color-mix(in oklab, #8b5cf6 45%, transparent); }
  #timeline button[data-running='true'] { background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, color-mix(in oklab, currentColor 25%, transparent) 4px, color-mix(in oklab, currentColor 25%, transparent) 8px); }
  #timeline button[aria-current='true'] { outline: 2px solid currentColor; outline-offset: -2px; }
  #timeline-legend { display: flex; gap: .75rem; font-size: .72rem; opacity: .6; margin: -.4rem 0 .7rem; }
  #ledger .when, #ledger .usage { opacity: .55; font-size: .76rem; }
  #ledger .usage.provider { color: #2fa36b; opacity: .9; }
  #ledger pre { white-space: pre-wrap; word-break: break-word; background: color-mix(in oklab, currentColor 6%, transparent); padding: .5rem .6rem; border-radius: .3rem; font-size: .8rem; margin: .3rem 0 0; }
  #ledger .loose { margin-top: .8rem; }
  /**
   * The left column is the **folder tree**, and the row's layout is what makes it readable: a boxed
   * `+` / `−` disclosure, the kind's icon, the type's badge, the folder's name as the label, and a
   * session marker only where a session actually is.
   */
  #tree, #tree ol { list-style: none; margin: 0; padding: 0; }
  #tree ol { padding-left: .85rem; border-left: 1px solid var(--line); }
  #tree li { padding: 0; }
  #tree .row { display: flex; align-items: center; gap: .35rem; padding: .16rem .3rem; border-radius: .3rem; cursor: pointer; }
  #tree .row:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  #tree .row[aria-current='true'] { background: color-mix(in oklab, currentColor 14%, transparent); }
  #tree .twisty { font: inherit; line-height: 1; padding: 0; width: 1.05rem; height: 1.05rem; display: inline-flex; align-items: center; justify-content: center; background: none; border: 1px solid var(--line); border-radius: .2rem; color: inherit; opacity: .75; cursor: pointer; }
  #tree .kind { display: inline-flex; opacity: .8; }
  #tree .badge { font-size: .66rem; letter-spacing: .04em; padding: 0 .25rem; border: 1px solid var(--line); border-radius: .25rem; opacity: .8; }
  #tree .label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tree .mark { font-size: .7rem; opacity: .5; }
  #tree .mark.on { color: #2fa36b; opacity: 1; }
  #tree .turns { font-size: .72rem; opacity: .5; }
  #tree li[data-kind='generated'] .label { opacity: .55; }
  #tree li[data-kind='folder'] .label { opacity: .8; }
  #tree .empty { font-size: .78rem; opacity: .5; padding-left: 1.4rem; }
  #history { margin-top: .9rem; }
  #history > summary { cursor: pointer; font-size: .8rem; opacity: .6; }
  /**
   * The composer is a flex row, and **this rule is load-bearing**: without it the form is a block, the
   * textarea is an inline-level box, and the prompt occupies about a sixth of the panel with the run button
   * beside it. Measured after it went missing: form 1046px wide, textarea 181px.
   *
   * It went missing because an edit that inserted the ledger's styles used this block as its anchor and
   * replaced it without restoring it — a regression no test noticed, because nothing judged the composer's
   * width. The check that exists now does.
   */
  form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: vertical; min-height: 3.5rem; font: inherit; padding: .5rem; }
  button { font: inherit; padding: .5rem 1rem; }
</style>
</head>
<body>
<aside>
  <h1>Workspaces</h1>
  <ul id="tree" role="tree" aria-label="workspace folders"></ul>
  <p id="tree-note" class="meta" hidden></p>
  <details id="history">
    <summary>All sessions</summary>
    <ol id="sessions"></ol>
  </details>
</aside>
<!--
  The divider between the sidebar and the content.

  It is a real separator rather than a styled border: `role="separator"` with `tabindex` makes it keyboard
  operable, and `aria-valuenow` reports the width it sets, so the control is usable without a mouse. The
  width it produces is a CSS custom property, which is what lets one number position the panel and its
  divider without the two drifting apart.
-->
<div id="gutter-left" role="separator" aria-orientation="vertical" aria-label="resize the sidebar" aria-valuemin="12" aria-valuemax="48" aria-valuenow="22" tabindex="0"></div>
<main>
  <nav id="views" aria-label="view">
    <button type="button" data-view="chat" aria-current="true">Chat</button>
    <button type="button" data-view="trajectory">Trajectory</button>
  </nav>
  <div id="log" data-view="chat"></div>
  <!--
    The timeline is a sibling of the ledger, not a child of it.

    Measured: as a child it was deleted by the first `replaceChildren()` the ledger does, so the band was
    cleared and then filled into an element that no longer existed — the ledger rendered and the timeline
    silently did not. A band that scrolls the ledger cannot live inside the thing it scrolls.
  -->
  <div id="timeline" data-view="trajectory" aria-label="timeline" role="navigation" hidden></div>
  <div id="ledger" data-view="trajectory" hidden></div>
  <form id="prompt">
    <textarea name="prompt" placeholder="ask heddle something" autofocus></textarea>
    <button>run</button>
  </form>
</main>
<script type="module">
const log = document.getElementById('log')
const ledger = document.getElementById('ledger')
const timeline = document.getElementById('timeline')
/** Where each turn's section is, so picking a segment can take the reader to it. */
const turnAnchors = new Map()

/**
 * Whether the ledger should keep moving to its newest record.
 *
 * The rule DSH states and the reason it exists: the view follows the tail while a session is running, and
 * **stops following when the reader scrolls up**, so arriving records do not move the text being read. A
 * ledger that always jumped to the bottom would be unusable during a long turn, which is exactly when a
 * person wants to read what already happened.
 *
 * It starts true, because opening at the tail is what a reader wants from a view of what just happened.
 */
let followTail = true
/** How close to the bottom still counts as following. A few pixels, because a scrollbar is not exact. */
const FOLLOW_SLACK_PX = 24

ledger.addEventListener('scroll', () => {
  const distance = ledger.scrollHeight - ledger.scrollTop - ledger.clientHeight
  followTail = distance <= FOLLOW_SLACK_PX
})

/**
 * Put the newest record in view, when the reader has not scrolled away from it.
 *
 * Written on the next frame rather than immediately, and that is a fix rather than a flourish: measured, the
 * ledger opened 40px short of its tail because the scroll was written before the legend that sits above the
 * rows had been laid out, so the pane grew underneath the position. Scrolling after layout has settled is
 * what makes "opens at the tail" true rather than nearly true.
 */
function followLedgerTail() {
  if (!followTail || view !== 'trajectory') return
  const place = () => {
    if (followTail && view === 'trajectory') ledger.scrollTop = ledger.scrollHeight
  }
  place()
  requestAnimationFrame(place)
}
const list = document.getElementById('sessions')
let current = null

function add(kind, text, merge = true, label) {
  if (text === '' || text === undefined) return
  const last = log.lastElementChild
  // The merge flag is what the live stream wants: deltas of one answer belong in one block. Passing
  // false is what history wants, where two consecutive entries of the same kind are two turns.
  //
  if (kind === 'assistant' && merge && last && last.tagName === 'DIV' && last.dataset.kind === 'assistant') {
    // Only a plain assistant div is merged into. An earlier version merged on `data-kind` alone, so a
    // reasoning block (a `details` whose data-kind is reasoning) was never the target — but the branch
    // still looked for `[data-body]` on whatever the last child was, and a history render passes
    // merge=false... measured, that path is what threw and left the log holding one turn of nine.
    last.textContent += text
    log.scrollTop = log.scrollHeight
    return
  }
  if (kind === 'reasoning' || kind === 'tool') {
    addBlock(kind, text, merge, label)
    return
  }
  const node = document.createElement('div')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  node.textContent = text
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/**
 * A reasoning or tool block: one line while it is closed, the whole thing when it is opened.
 *
 * A `<details>` rather than a scripted toggle, which is what DSH's client uses too: the disclosure is the
 * browser's, so it works before hydration, keeps its keyboard behaviour, and needs no state. The block is
 * **closed** by default, because reasoning and tool arguments are the two things a reader wants out of the
 * way until asked for, while the answer itself is not.
 */
function addBlock(kind, text, merge, label) {
  const last = log.lastElementChild
  if (merge && last && last.dataset.kind === kind) {
    const body = last.querySelector('[data-body]')
    body.textContent += text
    last.querySelector('summary').textContent = oneLiner(kind, body.textContent, label)
    log.scrollTop = log.scrollHeight
    return
  }
  const node = document.createElement('details')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  // Named line, not summary: a local called summary shadows the global summary() for the type stripper,
  // which then read the call below as a call on a string. Measured.
  const line = document.createElement('summary')
  line.textContent = oneLiner(kind, text, label)
  const body = document.createElement('div')
  body.setAttribute('data-body', '')
  body.textContent = text
  node.append(line, body)
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/** The one line a closed block shows: the label when there is one, otherwise the kind and its size. */
function oneLiner(kind, text, label) {
  const size = text.length + ' chars'
  if (label) return label + '  (' + size + ')'
  return (kind === 'reasoning' ? 'reasoning' : kind) + '  (' + size + ')'
}

/**
 * Which view is showing.
 *
 * Both views read the **same** route with a different `view` parameter, so they cannot disagree about a
 * session: they are two projections of one read, not two fetches that can drift.
 */
let view = 'chat'

/** Switch views without refetching the session list, and fill the one being shown. */
async function showView(next) {
  view = next
  for (const button of document.querySelectorAll('#views button')) {
    if (button.dataset.view === view) button.setAttribute('aria-current', 'true')
    else button.removeAttribute('aria-current')
  }
  log.hidden = view !== 'chat'
  ledger.hidden = view !== 'trajectory'
  timeline.hidden = view !== 'trajectory'
  if (view === 'trajectory' && current !== null) {
    followTail = true
    await showLedger(current)
    followLedgerTail()
  }
}

/** Read the ledger projection for one session and draw it. */
let ledgerFetches = 0
async function showLedger(id) {
  ledger.replaceChildren()
  /**
   * Only the newest request draws. Without this, two overlapping reads can land out of order and the older
   * one paints last, which is the other half of the stacked-draw bug.
   */
  const ticket = ++ledgerFetches
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '?view=ledger')
    if (!response.ok) return
    const body = await response.json()
    if (ticket !== ledgerFetches) return
      renderLedger(body.ledger ?? { turns: [], loose: [], tokens: {}, records: 0, inFlight: 0 }, body.timeline ?? { spans: [], durationMs: 0 })
  } catch (error) {
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read the ledger: ' + (error && error.message)
    ledger.append(note)
  }
}

/** Milliseconds as something a person reads: 12ms, 1.4s, 2m 3s. */
function human(ms) {
  if (ms === undefined) return null
  if (ms < 1000) return ms + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's'
  return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's'
}

/**
 * One line of a record's own text, for the row.
 *
 * The row used to show the record's **label** — which is its kind, or a tool's name — so every assistant row
 * read `assistant` and told a reader nothing about what was said. The label names the kind and the snippet
 * carries the content; a reader scanning a ledger wants both, and the second is the reason they are looking.
 *
 * Newlines and runs of spaces are collapsed, because a summary is one line by construction and a tool's
 * arguments are usually JSON with both.
 */
function snippet(text, limit = 110) {
  const flat = String(text ?? '').replace(/\s+/g, ' ').trim()
  if (flat.length === 0) return ''
  return flat.length > limit ? flat.slice(0, limit) + '…' : flat
}

/** The wall clock a record started at, to the second. */
function clock(at) {
  if (at === undefined) return null
  const date = new Date(at)
  return Number.isNaN(date.getTime()) ? null : date.toISOString().slice(11, 19)
}

/**
 * One record, as a disclosure.
 *
 * The summary is the identity — kind, label, when, how long, what it cost — and the body is the full input
 * or output. Closed by default for the same reason the chat view collapses reason and tool records: the
 * ledger's shape is what a reader scans, and the detail is what they open.
 */
function recordNode(record) {
  const node = document.createElement('details')
  node.className = 'record'
  node.dataset.kind = record.kind
  if (record.inFlight === true) node.dataset.inflight = 'true'
  const line = document.createElement('summary')
  /**
   * The badge carries the kind, and for a call it carries the tool's name too — that is the one thing a
   * reader scans for when asking "which of these was the shell".
   */
  const kind = document.createElement('span')
  kind.className = 'kind'
  kind.textContent = record.kind === 'tool' && record.label.startsWith('→ ') ? 'tool ' + record.label.slice(2) : record.kind
  const label = document.createElement('span')
  label.className = 'label clip'
  label.textContent = snippet(record.text) || record.label
  const when = document.createElement('span')
  when.className = 'when'
  const started = clock(record.startedAt)
  const lasted = human(record.durationMs)
  const ttft = human(record.ttftMs)
  /**
   * An in-flight record shows its start and no duration. Printing a duration for something still running
   * would be invented time, and it is the kind a reader believes.
   */
  when.textContent = [started, lasted === null ? (record.inFlight === true ? 'started' : null) : lasted, ttft === null ? null : 'ttft ' + ttft]
    .filter(Boolean)
    .join(' · ')
  line.append(kind, label, when)
  if (record.usage !== undefined) {
    const usage = document.createElement('span')
    usage.className = 'usage' + (record.usageSource === 'provider' ? ' provider' : '')
    /**
     * Each count is printed only when it is present, and the source is named, because the harness's estimate
     * and a provider's report are different claims. An absent count prints nothing rather than a zero.
     */
    const parts = []
    if (record.usage.inputTokens !== undefined) parts.push('in ' + record.usage.inputTokens)
    if (record.usage.outputTokens !== undefined) parts.push('out ' + record.usage.outputTokens)
    usage.textContent = parts.join(' ') + (record.usageSource === 'provider' ? ' (reported)' : ' (estimated)')
    line.append(usage)
  }
  node.append(line)
  const body = document.createElement('pre')
  body.textContent = record.text.length > 0 ? record.text : '(no text recorded)'
  node.append(body)
  if (record.note !== undefined) {
    const note = document.createElement('div')
    note.className = 'when'
    note.textContent = record.note
    node.append(note)
  }
  return node
}

/** Draw the whole ledger: a totals line, then each turn with its steps. */
/**
 * The timeline band: one button per span, positioned along the session's recorded span.
 *
 * Each button carries its turn number as its text for a screen reader and as a tooltip for a mouse, and
 * picking it scrolls the ledger to that turn. A span whose turn is still running is striped rather than
 * given a width it cannot justify — the same rule the rows follow.
 */
function renderTimeline(timeline_) {
  timeline.replaceChildren()
  const spans = timeline_?.spans ?? []
  if (spans.length === 0) return
  for (const span of spans) {
    const button = document.createElement('button')
    button.type = 'button'
    button.style.left = (span.start * 100).toFixed(3) + '%'
    button.style.width = Math.max((span.end - span.start) * 100, 0.4).toFixed(3) + '%'
    button.dataset.turn = String(span.turn)
    button.dataset.leading = span.kinds[0] ?? 'system'
    if (span.running) button.dataset.running = 'true'
    button.title = 'turn ' + span.turn + ' · ' + span.records + ' record(s)' + (span.running ? ' · running' : '')
    button.setAttribute('aria-label', button.title)
    button.addEventListener('click', () => {
      const anchor = turnAnchors.get(span.turn)
      if (anchor === undefined) return
      for (const other of timeline.querySelectorAll('button')) other.removeAttribute('aria-current')
      button.setAttribute('aria-current', 'true')
      anchor.scrollIntoView({ block: 'start', behavior: 'smooth' })
    })
    timeline.append(button)
  }
  const legend = document.createElement('div')
  legend.id = 'timeline-legend'
  const total = timeline_?.durationMs ?? 0
  legend.textContent = [human(total) + ' recorded', spans.length + ' turn(s)'].filter(Boolean).join(' · ')
  timeline.after(legend)
}

function renderLedger(data, timeline_ = { spans: [], durationMs: 0 }) {
  /**
   * The pane is cleared here, not only in the caller.
   *
   * Measured in a browser: switching view and finishing a live turn at the same moment produced two ledgers
   * stacked in one pane. Both were real renders — the two calls raced — and clearing at the point of drawing
   * is what makes a render idempotent regardless of who called it.
   */
  ledger.replaceChildren()
  turnAnchors.clear()
  for (const stale of document.querySelectorAll('#timeline-legend')) stale.remove()
  renderTimeline(timeline_)
  const summary = document.createElement('div')
  summary.className = 'summary'
  const bits = [data.records + ' record(s)']
  if (data.turns.length > 0) bits.push(data.turns.length + ' turn(s)')
  if (data.inFlight > 0) bits.push(data.inFlight + ' running')
  const tokens = data.tokens ?? {}
  if (tokens.input !== undefined) bits.push('in ' + tokens.input + ' tokens (reported)')
  if (tokens.output !== undefined) bits.push('out ' + tokens.output + ' tokens (reported)')
  if (tokens.estimated !== undefined) bits.push(tokens.estimated + ' tokens estimated')
  summary.textContent = bits.join(' · ')
  ledger.append(summary)

  for (const turn of data.turns) {
    const box = document.createElement('section')
    box.className = 'turn'
    const header = document.createElement('header')
    const when = clock(turn.startedAt)
    header.textContent = ['turn ' + turn.index, when, human(turn.durationMs)].filter(Boolean).join(' · ')
    box.append(header)
    for (const step of turn.steps) {
      const stepBox = document.createElement('div')
      stepBox.className = 'step'
      const stepHeader = document.createElement('div')
      stepHeader.className = 'step > header'
      const bits2 = ['step ' + step.index, step.model, clock(step.startedAt), human(step.durationMs)].filter(Boolean)
      stepHeader.textContent = bits2.join(' · ')
      stepBox.append(stepHeader)
      for (const record of step.records) stepBox.append(recordNode(record))
      box.append(stepBox)
    }
    turnAnchors.set(turn.index, box)
    ledger.append(box)
  }

  /**
   * Records that belong to no turn are shown rather than hidden. A ledger that quietly drops what it does not
   * recognise cannot be trusted to be complete.
   */
  if (data.loose !== undefined && data.loose.length > 0) {
    const box = document.createElement('section')
    box.className = 'turn loose'
    const header = document.createElement('header')
    header.textContent = 'before any turn'
    box.append(header)
    for (const record of data.loose) box.append(recordNode(record))
    ledger.append(box)
  }
}

async function showSession(id) {
  current = id
  await refreshSessions()
  if (view === 'trajectory') await showLedger(id)
  /**
   * The log is cleared and refilled from the session's own history.
   *
   * This is the half that was missing: selecting a session used to leave the right side empty, because
   * the only thing that ever wrote to it was the live stream and those events had already happened.
   */
  log.replaceChildren()
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id))
    if (!response.ok) return
    const body = await response.json()
    /**
     * Each turn renders inside its own guard.
     *
     * A history that stops at the first turn it cannot draw is worse than one that skips it: measured, one
     * bad turn left the log holding a single message out of nine, and nothing said why. A skipped turn is
     * recorded in the DOM as a visible note so the failure is not silent.
     */
    for (const turn of body.turns ?? []) {
      try {
        add(turn.kind, turn.text, false, turn.label)
      } catch (error) {
        const note = document.createElement('div')
        note.className = 'turn denied'
        note.textContent = 'could not render a ' + turn.kind + ' turn: ' + (error && error.message)
        log.append(note)
      }
    }
  } catch (error) {
    // A history that cannot be read must not empty the live view as well; the stream keeps appending.
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read this session: ' + (error && error.message)
    log.append(note)
  }
}

async function refreshSessions() {
  const response = await fetch('/api/sessions')
  if (!response.ok) return
  const sessions = await response.json()
  /**
   * The newest session is selected when nothing is yet.
   *
   * Without this the page starts attached to nothing: the list appears, the log stays empty even though
   * sessions exist, and a prompt sent from that state creates a NEW session instead of continuing the one
   * a person is looking at. Measured: asking a question produced a two-message live view while the session
   * beside it held the whole transcript, because `current` was null and the click that followed selected
   * the session the prompt had just created rather than the one holding history.
   */
  const select = current ?? sessions[0]?.id ?? null
  if (current === null && select !== null) {
    current = select
    await showSession(select)
    return
  }
  const rows = sessions.slice(0, 50).map((session) => {
    const item = document.createElement('li')
    item.innerHTML = '<div>' + (session.title ?? session.id) + '</div><div class="meta">' + session.turns + ' turn(s) · ' + session.created + '</div>'
    if (session.id === current) item.setAttribute('aria-current', 'true')
    item.onclick = () => { showSession(session.id) }
    return item
  })
  list.replaceChildren(...rows)
}

const events = new EventSource('/api/events')
events.addEventListener('session', (message) => {
  const payload = JSON.parse(message.data)
  if (current && payload.session !== current) return
  const event = payload.event
  if (event.type === 'assistant/chunk' && event.chunk.type === 'text-delta') add('assistant', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'reasoning-delta') add('reasoning', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'tool-call') add('tool', event.chunk.arguments ?? '{}', false, '→ ' + event.chunk.name)
  else if (event.type === 'message' && event.message.role === 'user') add('user', event.message.content.map((part) => part.text ?? '').join(''))
  else if (event.type === 'message' && event.message.role === 'tool') add(event.message.content.some((part) => part.text?.startsWith('error')) ? 'denied' : 'tool', event.message.content.map((part) => part.text ?? '').join(''))
  /**
   * The ledger is a projection and is refetched rather than appended to, so following it means asking for it
   * again — and only when the reader has not scrolled away.
   */
  if (view === 'trajectory' && followTail && current !== null) {
    if (ledgerRefetchTimer !== null) clearTimeout(ledgerRefetchTimer)
    ledgerRefetchTimer = setTimeout(() => {
      ledgerRefetchTimer = null
      void showLedger(current)
    }, 500)
  }
})

/** Coalesces the burst of events one turn produces into a single ledger refetch. */
let ledgerRefetchTimer = null

/**
 * The sidebar is resizable, and the width survives a reload.
 *
 * The bounds are in `rem` and expressed in the same unit as the layout, so a reader who has enlarged their
 * default text size gets a proportionally wider panel rather than one measured in pixels that no longer
 * fits its contents. The upper bound also respects the window: a sidebar wider than four fifths of the
 * viewport leaves nothing to work in, which reads as the app being broken rather than as a choice.
 */
const SIDEBAR_KEY = 'heddle.layout.sidebar.v1'
const SIDEBAR_MIN_REM = 12
const SIDEBAR_MAX_REM = 48

/** The root font size, so rem bounds can be compared with pixel measurements from the window. */
function remPx() {
  return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16
}

/** How wide the sidebar may be right now: its own bounds, and the window's. */
function sidebarBounds() {
  const root = remPx()
  const byWindow = (window.innerWidth * 0.8) / root
  return { min: SIDEBAR_MIN_REM, max: Math.max(SIDEBAR_MIN_REM, Math.min(SIDEBAR_MAX_REM, byWindow)) }
}

function clampSidebar(rem) {
  const bounds = sidebarBounds()
  return Math.min(Math.max(rem, bounds.min), bounds.max)
}

/** Apply a width, and report it so assistive technology can read the control's value. */
function setSidebarWidth(rem, options = {}) {
  const width = clampSidebar(rem)
  document.documentElement.style.setProperty('--sidebar-width', width + 'rem')
  gutterLeft.setAttribute('aria-valuenow', String(Math.round(width)))
  if (options.persist !== false) {
    try {
      localStorage.setItem(SIDEBAR_KEY, String(width))
    } catch {
      // A browser that refuses storage still gets a working divider; only the memory is lost.
    }
  }
  return width
}

/** The stored width, when it is a number this layout can use. */
function storedSidebarWidth() {
  try {
    const value = Number(localStorage.getItem(SIDEBAR_KEY))
    return Number.isFinite(value) && value > 0 ? value : null
  } catch {
    return null
  }
}

const gutterLeft = document.getElementById('gutter-left')

/**
 * Drag the divider.
 *
 * Pointer capture is what keeps the drag attached to the divider when the pointer leaves it — without it a
 * quick drag across the content drops the gesture and the panel stops following, which feels like the
 * control is broken. The width is computed from the pointer's distance to the sidebar's own left edge
 * rather than from a stored offset, so the result cannot drift if the window is resized mid-drag.
 */
gutterLeft.addEventListener('pointerdown', (downEvent) => {
  downEvent.preventDefault()
  /**
   * Capture is attempted, not required.
   *
   * It is what keeps a drag attached when the pointer leaves the divider — without it a quick drag across
   * the content drops the gesture and the panel stops following. But it throws for a pointer the browser is
   * not tracking, which is exactly what a synthetic event is: measured, an automated drag dispatched
   * `pointerdown`/`pointermove`/`pointerup` and the panel never moved, because the throw aborted the handler
   * before the listeners were bound. Guarding it means the control works for real pointers and can still be
   * exercised, and judged, by a script.
   */
  try {
    gutterLeft.setPointerCapture(downEvent.pointerId)
  } catch {
    // A pointer the browser is not tracking still drags; it simply is not captured.
  }
  gutterLeft.dataset.dragging = 'true'
  const left = document.querySelector('aside').getBoundingClientRect().left

  const move = (moveEvent) => setSidebarWidth((moveEvent.clientX - left) / remPx())
  const stop = () => {
    delete gutterLeft.dataset.dragging
    gutterLeft.removeEventListener('pointermove', move)
    gutterLeft.removeEventListener('pointerup', stop)
    gutterLeft.removeEventListener('pointercancel', stop)
  }
  gutterLeft.addEventListener('pointermove', move)
  gutterLeft.addEventListener('pointerup', stop)
  gutterLeft.addEventListener('pointercancel', stop)
})

/** Keyboard: a separator with focus is a control, and a control responds to the arrow keys. */
gutterLeft.addEventListener('keydown', (keyEvent) => {
  const step = keyEvent.shiftKey ? 4 : 1
  const current = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 22
  if (keyEvent.key === 'ArrowLeft') setSidebarWidth(current - step)
  else if (keyEvent.key === 'ArrowRight') setSidebarWidth(current + step)
  else if (keyEvent.key === 'Home') setSidebarWidth(SIDEBAR_MIN_REM)
  else if (keyEvent.key === 'End') setSidebarWidth(SIDEBAR_MAX_REM)
  else return
  keyEvent.preventDefault()
})

/** A window narrowed past the stored width must not leave the sidebar wider than the space for it. */
window.addEventListener('resize', () => setSidebarWidth(
  parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 22,
  { persist: false },
))

const rememberedSidebar = storedSidebarWidth()
if (rememberedSidebar !== null) setSidebarWidth(rememberedSidebar, { persist: false })

document.getElementById('prompt').addEventListener('submit', async (submitEvent) => {
  submitEvent.preventDefault()
  const textarea = submitEvent.target.elements.prompt
  const prompt = textarea.value.trim()
  if (prompt === '') return
  textarea.value = ''
  add('user', prompt)
  const response = await fetch('/api/turn', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    /**
     * The folder is named when a tree node is selected, and the server continues **that folder's**
     * session. With no selection the request is what it always was — a session in the server's own
     * working directory — so a window opened without touching the tree still works.
     */
    body: JSON.stringify({ prompt, session: current, folder: activeFolder }),
  })
  if (!response.ok) { add('denied', 'request refused: ' + response.status); return }
  const reader = response.body.getReader()
  const decoder = new TextDecoder()
  let buffer = ''
  for (;;) {
    const { value, done } = await reader.read()
    if (done) break
    buffer += decoder.decode(value, { stream: true })
    for (const block of buffer.split('\\n\\n')) {
      if (!block.trim().startsWith('event:')) continue
      const name = /event: (.+)/.exec(block)?.[1]
      const data = /data: (.+)/.exec(block)?.[1]
      if (!data) continue
      const payload = JSON.parse(data)
      if (name === 'session') {
        current = payload.session
        const event = payload.event
        if (event.type === 'assistant/chunk' && event.chunk.type === 'text-delta') add('assistant', event.chunk.text)
        else if (event.type === 'assistant/chunk' && event.chunk.type === 'reasoning-delta') add('reasoning', event.chunk.text)
      } else if (name === 'done') {
        for (const denial of payload.denials ?? []) add('denied', denial.tool + ': ' + denial.message)
        /**
         * The turn may have created **this folder's** session, so both the tree and the list are
         * re-read.
         *
         * The view-ring handler sat inside this branch until 2026-10-11, and it was a defect rather
         * than a placement: every finished turn registered another identical listener, and the same
         * registration appeared twice more at the end of the file. Measured: three handlers after one
         * turn, one more per turn after that. It is registered once, below.
         */
        renderTree()
        refreshSessions()
      } else if (name === 'error') add('denied', payload.message)
    }
    const lastBreak = buffer.lastIndexOf('\\n\\n')
    if (lastBreak !== -1) buffer = buffer.slice(lastBreak + 2)
  }
})

/**
 * The left column: the folder tree of every registered workspace.
 *
 * Three rules are the owner's, and this renderer follows them rather than re-deriving them:
 *
 * - **A type folder is the boundary, and a session row exists only for an instance of one.** The
 *   server decides that and sends `session: null` everywhere else, so the page never guesses; a
 *   folder without a session is still navigable, it is simply not a place to work.
 * - **`+` and `−` are the disclosure**, in a boxed hit target, with the state on the row and the
 *   children inside a `role="group"` — the shape the owner asked for by name.
 * - **One level at a time.** A node's children are fetched when it is opened, and the expanded set is
 *   kept in `localStorage` so a reload comes back to the same shape.
 */
const treeList = document.getElementById('tree')
const treeNote = document.getElementById('tree-note')
const EXPANDED_KEY = 'heddle.tree.expanded.v1'

/** Where each drawn node is, so a remembered path can be opened without walking the DOM by label. */
const rowIndex = new Map()

/** The folder the prompt box belongs to, so a run continues the folder a person selected. */
let activeFolder = null

function readExpanded() {
  try {
    return new Set(JSON.parse(localStorage.getItem(EXPANDED_KEY) ?? '[]'))
  } catch (error) {
    return new Set()
  }
}

const expanded = readExpanded()

function rememberExpanded() {
  try {
    localStorage.setItem(EXPANDED_KEY, JSON.stringify([...expanded]))
  } catch (error) {
    // A browser that refuses storage still gets the tree; only the memory of its shape is lost.
  }
}

function setNote(text) {
  treeNote.textContent = text ?? ''
  treeNote.hidden = text === undefined || text === null || text === ''
}

const FOLDER_PATH = 'M2 4.6A1.6 1.6 0 0 1 3.6 3h2.6l1.6 2h4.6A1.6 1.6 0 0 1 14 6.6v4.8A1.6 1.6 0 0 1 12.4 13H3.6A1.6 1.6 0 0 1 2 11.4z'
/** The one mark that distinguishes a type folder from a plain one: the braces around its name. */
const TYPE_MARK = 'M6.3 7.4 5 9.5l1.3 2.1M9.7 7.4 11 9.5l-1.3 2.1'

function svgPath(d) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
  path.setAttribute('d', d)
  return path
}

/** One inline SVG per kind of node, drawn in `currentColor` so it follows the theme. */
function kindIcon(kind) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  svg.setAttribute('viewBox', '0 0 16 16')
  svg.setAttribute('width', '14')
  svg.setAttribute('height', '14')
  svg.setAttribute('fill', 'none')
  svg.setAttribute('stroke', 'currentColor')
  svg.setAttribute('stroke-width', '1.2')
  svg.setAttribute('stroke-linejoin', 'round')
  svg.setAttribute('aria-hidden', 'true')
  if (kind === 'generated') svg.setAttribute('stroke-dasharray', '2 1.5')
  svg.append(svgPath(FOLDER_PATH))
  if (kind === 'type') svg.append(svgPath(TYPE_MARK))
  if (kind === 'instance') {
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle')
    dot.setAttribute('cx', '8')
    dot.setAttribute('cy', '9.9')
    dot.setAttribute('r', '1.5')
    dot.setAttribute('fill', 'currentColor')
    dot.setAttribute('stroke', 'none')
    svg.append(dot)
  }
  return svg
}

function selectNode(node) {
  if (node.session) {
    activeFolder = node.path
    setNote('')
    showSession(node.session.id)
    return
  }
  if (node.kind === 'instance') {
    /**
     * An instance with no session yet is where work starts: selecting it points the prompt box at the
     * folder and clears the pane, and the first prompt creates the session through `/api/turn`.
     */
    activeFolder = node.path
    current = null
    log.replaceChildren()
    ledger.replaceChildren()
    setNote('a new conversation in ' + node.label)
    return
  }
  setNote('a session lives in an instance — open the folder inside a type folder')
}

function nodeRow(node) {
  const li = document.createElement('li')
  li.setAttribute('role', 'treeitem')
  // The state lives on the tree item, where a reader is told about it, and on the control's label.
  li.setAttribute('aria-expanded', 'false')
  li.dataset.kind = node.kind
  li.dataset.open = 'false'

  const row = document.createElement('div')
  row.className = 'row'
  row.dataset.path = node.path
  row.tabIndex = 0
  if (node.session && node.session.id === current) row.setAttribute('aria-current', 'true')

  const twisty = document.createElement('button')
  twisty.type = 'button'
  twisty.className = 'twisty'
  twisty.textContent = '+'
  twisty.setAttribute('aria-label', 'expand ' + node.label)
  twisty.onclick = async (event) => {
    event.stopPropagation()
    await toggle(node, li, twisty)
  }

  row.append(twisty, kindIcon(node.kind))
  if (node.badge) {
    const badge = document.createElement('span')
    badge.className = 'badge'
    badge.textContent = node.badge
    row.append(badge)
  }
  const label = document.createElement('span')
  label.className = 'label'
  label.textContent = node.label
  row.append(label)
  /**
   * The marker says whether there is a session **and** whether there could be one: a hollow dot on an
   * instance with none is the invitation, and a filled one is the record.
   */
  if (node.kind === 'instance') {
    const mark = document.createElement('span')
    mark.className = node.session ? 'mark on' : 'mark'
    mark.textContent = node.session ? '●' : '○'
    mark.title = node.session ? 'has a session' : 'no session yet'
    row.append(mark)
  }
  if (node.session) {
    const turns = document.createElement('span')
    turns.className = 'turns'
    turns.textContent = node.session.turns + 't'
    row.append(turns)
  }

  row.onclick = () => {
    selectNode(node)
    for (const other of treeList.querySelectorAll('.row[aria-current]')) other.removeAttribute('aria-current')
    if (node.session) row.setAttribute('aria-current', 'true')
  }
  row.onkeydown = (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault()
      row.onclick()
    }
  }

  li.append(row)
  rowIndex.set(node.path, { node, li, twisty })
  return li
}

/** Draw a node's children, fetching them when they were not part of the answer that drew the node. */
async function loadChildren(node, li, twisty) {
  const group = document.createElement('ul')
  group.setAttribute('role', 'group')
  li.append(group)
  let children = node.children
  if (children === null) {
    try {
      const response = await fetch('/api/tree?path=' + encodeURIComponent(node.path))
      if (!response.ok) throw new Error('the tree answered ' + response.status)
      children = (await response.json()).children ?? []
    } catch (error) {
      setNote('could not read ' + node.label + ': ' + (error && error.message))
      children = []
    }
  }
  if (children.length === 0) {
    /**
     * A folder with nothing inside still opens **and closes**.
     *
     * The first version disabled the disclosure here and turned it into `·`, which the owner hit at
     * once: a leaf could be opened and then had no way back, because the only control that closed a
     * node was the one just disabled. Whether a folder is empty is only known after asking, so the
     * control cannot be the thing that reports it — the note below does, and `+` / `−` keep meaning
     * what they say.
     */
    const empty = document.createElement('div')
    empty.className = 'empty'
    empty.textContent = 'no folders inside'
    group.append(empty)
    return
  }
  for (const child of children) group.append(nodeRow(child))
}

async function toggle(node, li, twisty) {
  const open = li.dataset.open === 'true'
  if (open) {
    li.dataset.open = 'false'
    li.setAttribute('aria-expanded', 'false')
    twisty.textContent = '+'
    twisty.setAttribute('aria-label', 'expand ' + node.label)
    li.querySelector('ul[role=group]')?.remove()
    expanded.delete(node.path)
    rememberExpanded()
    return
  }
  li.dataset.open = 'true'
  li.setAttribute('aria-expanded', 'true')
  twisty.textContent = '−'
  twisty.setAttribute('aria-label', 'collapse ' + node.label)
  expanded.add(node.path)
  rememberExpanded()
  await loadChildren(node, li, twisty)
}

async function renderTree() {
  rowIndex.clear()
  let body
  try {
    const response = await fetch('/api/tree')
    if (!response.ok) {
      treeList.replaceChildren()
      setNote(
        response.status === 503
          ? 'this profile does not load the workspace plugin'
          : 'the tree answered ' + response.status,
      )
      return
    }
    body = await response.json()
  } catch (error) {
    setNote('could not read the tree: ' + (error && error.message))
    return
  }
  const tops = body.children ?? []
  if (tops.length === 0) setNote('no workspace root yet — register one with heddle workspace add')
  else setNote(activeFolder === null ? '' : 'a new conversation in ' + activeFolder.split('/').filter(Boolean).pop())
  treeList.replaceChildren(...tops.map(nodeRow))
  /**
   * A reload comes back to the shape a person left: the remembered nodes are opened again shallowest
   * first, so a deeper one is drawn by the time its turn comes, and each level is re-read rather than
   * remembered, because a cached level is a level that can be stale.
   */
  for (const path of [...expanded].sort((left, right) => left.split('/').length - right.split('/').length)) {
    const entry = rowIndex.get(path)
    if (entry === undefined || entry.li.dataset.open === 'true') continue
    await toggle(entry.node, entry.li, entry.twisty)
  }
}

document.getElementById('views').addEventListener('click', (clickEvent) => {
  const button = clickEvent.target.closest('button[data-view]')
  if (button) showView(button.dataset.view)
})

refreshSessions()
renderTree()
</script>
</body>
