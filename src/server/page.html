<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heddle</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in oklab, currentColor 20%, transparent); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; display: flex; height: 100vh; }
  aside { width: 22rem; border-right: 1px solid var(--line); overflow-y: auto; padding: .75rem; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  h1 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; opacity: .6; margin: .25rem 0 .5rem; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: .4rem .5rem; border-radius: .35rem; cursor: pointer; }
  li:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  li[aria-current] { background: color-mix(in oklab, currentColor 14%, transparent); }
  .meta { opacity: .6; font-size: .78rem; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
  .turn { border-left: 3px solid var(--line); padding-left: .6rem; white-space: pre-wrap; }
  .turn.user { border-color: #4b8bf5; }
  .turn.assistant { border-color: #2fa36b; }
  .turn.reasoning { border-color: #b7791f; opacity: .85; }
  .turn.reasoning[open] [data-body] { font-style: italic; }
  details.turn > summary { cursor: pointer; font-size: .82rem; opacity: .75; list-style: none; }
  details.turn > summary::-webkit-details-marker { display: none; }
  details.turn > summary::before { content: '▸ '; }
  details.turn[open] > summary::before { content: '▾ '; }
  details.turn > [data-body] { margin-top: .35rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85em; }
  .turn.tool { border-color: #8b5cf6; font-family: ui-monospace, monospace; font-size: .85em; }
  .turn.denied { border-color: #d14343; color: #d14343; }
  nav#views { display: flex; gap: .25rem; padding: .5rem .75rem 0; border-bottom: 1px solid var(--line); }
  nav#views button { font: inherit; font-size: .82rem; padding: .3rem .7rem; background: none; border: 1px solid transparent; border-bottom: none; border-radius: .35rem .35rem 0 0; color: inherit; opacity: .6; cursor: pointer; }
  nav#views button[aria-current='true'] { opacity: 1; border-color: var(--line); background: color-mix(in oklab, currentColor 7%, transparent); }
  #ledger { flex: 1; overflow-y: auto; padding: .75rem 1rem 1rem; font-size: .85rem; }
  #ledger .summary { font-size: .8rem; opacity: .7; margin-bottom: .6rem; }
  #ledger .turn { border-left: 3px solid var(--line); margin: 0 0 .9rem; padding-left: .6rem; }
  #ledger .turn > header { font-weight: 600; font-size: .8rem; }
  #ledger .step { margin: .4rem 0 .4rem .6rem; padding-left: .6rem; border-left: 1px dashed var(--line); }
  #ledger .step > header { font-size: .78rem; opacity: .7; }
  #ledger details.record { margin: .25rem 0; }
  /**
   * A record's row is exactly one line, truncated with an ellipsis, and opens on click.
   *
   * DSH's trajectory rows do this — `text-overflow: ellipsis` with `white-space: nowrap` on the row, and
   * `min-width: 0` on the flexible child — and the last part is the one that is easy to miss: without it a
   * flex item refuses to shrink below its content, so instead of being clipped the row pushes its siblings
   * out of the pane. A ledger of long tool arguments is otherwise unreadable and unnavigable.
   */
  #ledger details.record > summary {
    cursor: pointer;
    font-size: .8rem;
    display: flex;
    gap: .5rem;
    align-items: baseline;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.5;
  }
  /**
   * The row's layout, and the three declarations that had to be right together.
   *
   * Measured in a browser, three times, each failure looking like success:
   *
   * 1. written as a descendant selector the label computed `text-overflow: clip`, so a long label was cut
   *    mid-letter with nothing saying it continued;
   * 2. as a class it computed `ellipsis` but `flex-shrink: 0`, because a sibling rule set `flex: none` on
   *    every child — and an item that may not shrink grows past the row instead of truncating, so the
   *    ellipsis was never needed and never drawn (`label.clientWidth` was 4028px in a 1016px row);
   * 3. with `flex: 1 1 auto` on the label and no `flex` rule on its siblings, the row holds one line and
   *    the label truncates with a visible ellipsis.
   *
   * The three parts are load-bearing together: the label is the only flexible child, it may shrink, and
   * what does not fit ends in an ellipsis.
   */
  #ledger details.record > summary > .label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #ledger details.record[data-inflight='true'] > summary::after { content: ' · running'; color: #b7791f; }
  #ledger .kind { font-family: ui-monospace, monospace; opacity: .75; min-width: 5.5rem; }
  #ledger .when, #ledger .usage { opacity: .55; font-size: .76rem; }
  #ledger .usage.provider { color: #2fa36b; opacity: .9; }
  #ledger pre { white-space: pre-wrap; word-break: break-word; background: color-mix(in oklab, currentColor 6%, transparent); padding: .5rem .6rem; border-radius: .3rem; font-size: .8rem; margin: .3rem 0 0; }
  #ledger .loose { margin-top: .8rem; }
  textarea { flex: 1; resize: vertical; min-height: 3.5rem; font: inherit; padding: .5rem; }
  button { font: inherit; padding: .5rem 1rem; }
</style>
</head>
<body>
<aside>
  <h1>Sessions</h1>
  <ol id="sessions"></ol>
</aside>
<main>
  <nav id="views" aria-label="view">
    <button type="button" data-view="chat" aria-current="true">Chat</button>
    <button type="button" data-view="trajectory">Trajectory</button>
  </nav>
  <div id="log" data-view="chat"></div>
  <div id="ledger" data-view="trajectory" hidden></div>
  <form id="prompt">
    <textarea name="prompt" placeholder="ask heddle something" autofocus></textarea>
    <button>run</button>
  </form>
</main>
<script type="module">
const log = document.getElementById('log')
const ledger = document.getElementById('ledger')
const list = document.getElementById('sessions')
let current = null

function add(kind, text, merge = true, label) {
  if (text === '' || text === undefined) return
  const last = log.lastElementChild
  // The merge flag is what the live stream wants: deltas of one answer belong in one block. Passing
  // false is what history wants, where two consecutive entries of the same kind are two turns.
  //
  if (kind === 'assistant' && merge && last && last.tagName === 'DIV' && last.dataset.kind === 'assistant') {
    // Only a plain assistant div is merged into. An earlier version merged on `data-kind` alone, so a
    // reasoning block (a `details` whose data-kind is reasoning) was never the target — but the branch
    // still looked for `[data-body]` on whatever the last child was, and a history render passes
    // merge=false... measured, that path is what threw and left the log holding one turn of nine.
    last.textContent += text
    log.scrollTop = log.scrollHeight
    return
  }
  if (kind === 'reasoning' || kind === 'tool') {
    addBlock(kind, text, merge, label)
    return
  }
  const node = document.createElement('div')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  node.textContent = text
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/**
 * A reasoning or tool block: one line while it is closed, the whole thing when it is opened.
 *
 * A `<details>` rather than a scripted toggle, which is what DSH's client uses too: the disclosure is the
 * browser's, so it works before hydration, keeps its keyboard behaviour, and needs no state. The block is
 * **closed** by default, because reasoning and tool arguments are the two things a reader wants out of the
 * way until asked for, while the answer itself is not.
 */
function addBlock(kind, text, merge, label) {
  const last = log.lastElementChild
  if (merge && last && last.dataset.kind === kind) {
    const body = last.querySelector('[data-body]')
    body.textContent += text
    last.querySelector('summary').textContent = oneLiner(kind, body.textContent, label)
    log.scrollTop = log.scrollHeight
    return
  }
  const node = document.createElement('details')
  node.className = 'turn ' + kind
  node.dataset.kind = kind
  // Named line, not summary: a local called summary shadows the global summary() for the type stripper,
  // which then read the call below as a call on a string. Measured.
  const line = document.createElement('summary')
  line.textContent = oneLiner(kind, text, label)
  const body = document.createElement('div')
  body.setAttribute('data-body', '')
  body.textContent = text
  node.append(line, body)
  log.append(node)
  log.scrollTop = log.scrollHeight
}

/** The one line a closed block shows: the label when there is one, otherwise the kind and its size. */
function oneLiner(kind, text, label) {
  const size = text.length + ' chars'
  if (label) return label + '  (' + size + ')'
  return (kind === 'reasoning' ? 'reasoning' : kind) + '  (' + size + ')'
}

/**
 * Which view is showing.
 *
 * Both views read the **same** route with a different `view` parameter, so they cannot disagree about a
 * session: they are two projections of one read, not two fetches that can drift.
 */
let view = 'chat'

/** Switch views without refetching the session list, and fill the one being shown. */
async function showView(next) {
  view = next
  for (const button of document.querySelectorAll('#views button')) {
    if (button.dataset.view === view) button.setAttribute('aria-current', 'true')
    else button.removeAttribute('aria-current')
  }
  log.hidden = view !== 'chat'
  ledger.hidden = view !== 'trajectory'
  if (view === 'trajectory' && current !== null) await showLedger(current)
}

/** Read the ledger projection for one session and draw it. */
let ledgerFetches = 0
async function showLedger(id) {
  ledger.replaceChildren()
  /**
   * Only the newest request draws. Without this, two overlapping reads can land out of order and the older
   * one paints last, which is the other half of the stacked-draw bug.
   */
  const ticket = ++ledgerFetches
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id) + '?view=ledger')
    if (!response.ok) return
    const body = await response.json()
    if (ticket !== ledgerFetches) return
    renderLedger(body.ledger ?? { turns: [], loose: [], tokens: {}, records: 0, inFlight: 0 })
  } catch (error) {
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read the ledger: ' + (error && error.message)
    ledger.append(note)
  }
}

/** Milliseconds as something a person reads: 12ms, 1.4s, 2m 3s. */
function human(ms) {
  if (ms === undefined) return null
  if (ms < 1000) return ms + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's'
  return Math.floor(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's'
}

/** The wall clock a record started at, to the second. */
function clock(at) {
  if (at === undefined) return null
  const date = new Date(at)
  return Number.isNaN(date.getTime()) ? null : date.toISOString().slice(11, 19)
}

/**
 * One record, as a disclosure.
 *
 * The summary is the identity — kind, label, when, how long, what it cost — and the body is the full input
 * or output. Closed by default for the same reason the chat view collapses reason and tool records: the
 * ledger's shape is what a reader scans, and the detail is what they open.
 */
function recordNode(record) {
  const node = document.createElement('details')
  node.className = 'record'
  node.dataset.kind = record.kind
  if (record.inFlight === true) node.dataset.inflight = 'true'
  const line = document.createElement('summary')
  const kind = document.createElement('span')
  kind.className = 'kind'
  kind.textContent = record.kind
  const label = document.createElement('span')
  label.className = 'label clip'
  label.textContent = record.label
  const when = document.createElement('span')
  when.className = 'when'
  const started = clock(record.startedAt)
  const lasted = human(record.durationMs)
  const ttft = human(record.ttftMs)
  /**
   * An in-flight record shows its start and no duration. Printing a duration for something still running
   * would be invented time, and it is the kind a reader believes.
   */
  when.textContent = [started, lasted === null ? (record.inFlight === true ? 'started' : null) : lasted, ttft === null ? null : 'ttft ' + ttft]
    .filter(Boolean)
    .join(' · ')
  line.append(kind, label, when)
  if (record.usage !== undefined) {
    const usage = document.createElement('span')
    usage.className = 'usage' + (record.usageSource === 'provider' ? ' provider' : '')
    /**
     * Each count is printed only when it is present, and the source is named, because the harness's estimate
     * and a provider's report are different claims. An absent count prints nothing rather than a zero.
     */
    const parts = []
    if (record.usage.inputTokens !== undefined) parts.push('in ' + record.usage.inputTokens)
    if (record.usage.outputTokens !== undefined) parts.push('out ' + record.usage.outputTokens)
    usage.textContent = parts.join(' ') + (record.usageSource === 'provider' ? ' (reported)' : ' (estimated)')
    line.append(usage)
  }
  node.append(line)
  const body = document.createElement('pre')
  body.textContent = record.text.length > 0 ? record.text : '(no text recorded)'
  node.append(body)
  if (record.note !== undefined) {
    const note = document.createElement('div')
    note.className = 'when'
    note.textContent = record.note
    node.append(note)
  }
  return node
}

/** Draw the whole ledger: a totals line, then each turn with its steps. */
function renderLedger(data) {
  /**
   * The pane is cleared here, not only in the caller.
   *
   * Measured in a browser: switching view and finishing a live turn at the same moment produced two ledgers
   * stacked in one pane. Both were real renders — the two calls raced — and clearing at the point of drawing
   * is what makes a render idempotent regardless of who called it.
   */
  ledger.replaceChildren()
  const summary = document.createElement('div')
  summary.className = 'summary'
  const bits = [data.records + ' record(s)']
  if (data.turns.length > 0) bits.push(data.turns.length + ' turn(s)')
  if (data.inFlight > 0) bits.push(data.inFlight + ' running')
  const tokens = data.tokens ?? {}
  if (tokens.input !== undefined) bits.push('in ' + tokens.input + ' tokens (reported)')
  if (tokens.output !== undefined) bits.push('out ' + tokens.output + ' tokens (reported)')
  if (tokens.estimated !== undefined) bits.push(tokens.estimated + ' tokens estimated')
  summary.textContent = bits.join(' · ')
  ledger.append(summary)

  for (const turn of data.turns) {
    const box = document.createElement('section')
    box.className = 'turn'
    const header = document.createElement('header')
    const when = clock(turn.startedAt)
    header.textContent = ['turn ' + turn.index, when, human(turn.durationMs)].filter(Boolean).join(' · ')
    box.append(header)
    for (const step of turn.steps) {
      const stepBox = document.createElement('div')
      stepBox.className = 'step'
      const stepHeader = document.createElement('div')
      stepHeader.className = 'step > header'
      const bits2 = ['step ' + step.index, step.model, clock(step.startedAt), human(step.durationMs)].filter(Boolean)
      stepHeader.textContent = bits2.join(' · ')
      stepBox.append(stepHeader)
      for (const record of step.records) stepBox.append(recordNode(record))
      box.append(stepBox)
    }
    ledger.append(box)
  }

  /**
   * Records that belong to no turn are shown rather than hidden. A ledger that quietly drops what it does not
   * recognise cannot be trusted to be complete.
   */
  if (data.loose !== undefined && data.loose.length > 0) {
    const box = document.createElement('section')
    box.className = 'turn loose'
    const header = document.createElement('header')
    header.textContent = 'before any turn'
    box.append(header)
    for (const record of data.loose) box.append(recordNode(record))
    ledger.append(box)
  }
}

async function showSession(id) {
  current = id
  await refreshSessions()
  if (view === 'trajectory') await showLedger(id)
  /**
   * The log is cleared and refilled from the session's own history.
   *
   * This is the half that was missing: selecting a session used to leave the right side empty, because
   * the only thing that ever wrote to it was the live stream and those events had already happened.
   */
  log.replaceChildren()
  try {
    const response = await fetch('/api/sessions/' + encodeURIComponent(id))
    if (!response.ok) return
    const body = await response.json()
    /**
     * Each turn renders inside its own guard.
     *
     * A history that stops at the first turn it cannot draw is worse than one that skips it: measured, one
     * bad turn left the log holding a single message out of nine, and nothing said why. A skipped turn is
     * recorded in the DOM as a visible note so the failure is not silent.
     */
    for (const turn of body.turns ?? []) {
      try {
        add(turn.kind, turn.text, false, turn.label)
      } catch (error) {
        const note = document.createElement('div')
        note.className = 'turn denied'
        note.textContent = 'could not render a ' + turn.kind + ' turn: ' + (error && error.message)
        log.append(note)
      }
    }
  } catch (error) {
    // A history that cannot be read must not empty the live view as well; the stream keeps appending.
    const note = document.createElement('div')
    note.className = 'turn denied'
    note.textContent = 'could not read this session: ' + (error && error.message)
    log.append(note)
  }
}

async function refreshSessions() {
  const response = await fetch('/api/sessions')
  if (!response.ok) return
  const sessions = await response.json()
  /**
   * The newest session is selected when nothing is yet.
   *
   * Without this the page starts attached to nothing: the list appears, the log stays empty even though
   * sessions exist, and a prompt sent from that state creates a NEW session instead of continuing the one
   * a person is looking at. Measured: asking a question produced a two-message live view while the session
   * beside it held the whole transcript, because `current` was null and the click that followed selected
   * the session the prompt had just created rather than the one holding history.
   */
  const select = current ?? sessions[0]?.id ?? null
  if (current === null && select !== null) {
    current = select
    await showSession(select)
    return
  }
  const rows = sessions.slice(0, 50).map((session) => {
    const item = document.createElement('li')
    item.innerHTML = '<div>' + (session.title ?? session.id) + '</div><div class="meta">' + session.turns + ' turn(s) · ' + session.created + '</div>'
    if (session.id === current) item.setAttribute('aria-current', 'true')
    item.onclick = () => { showSession(session.id) }
    return item
  })
  list.replaceChildren(...rows)
}

const events = new EventSource('/api/events')
events.addEventListener('session', (message) => {
  const payload = JSON.parse(message.data)
  if (current && payload.session !== current) return
  const event = payload.event
  if (event.type === 'assistant/chunk' && event.chunk.type === 'text-delta') add('assistant', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'reasoning-delta') add('reasoning', event.chunk.text)
  else if (event.type === 'assistant/chunk' && event.chunk.type === 'tool-call') add('tool', event.chunk.arguments ?? '{}', false, '→ ' + event.chunk.name)
  else if (event.type === 'message' && event.message.role === 'user') add('user', event.message.content.map((part) => part.text ?? '').join(''))
  else if (event.type === 'message' && event.message.role === 'tool') add(event.message.content.some((part) => part.text?.startsWith('error')) ? 'denied' : 'tool', event.message.content.map((part) => part.text ?? '').join(''))
})

document.getElementById('prompt').addEventListener('submit', async (submitEvent) => {
  submitEvent.preventDefault()
  const textarea = submitEvent.target.elements.prompt
  const prompt = textarea.value.trim()
  if (prompt === '') return
  textarea.value = ''
  add('user', prompt)
  const response = await fetch('/api/turn', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ prompt, session: current }),
  })
  if (!response.ok) { add('denied', 'request refused: ' + response.status); return }
  const reader = response.body.getReader()
  const decoder = new TextDecoder()
  let buffer = ''
  for (;;) {
    const { value, done } = await reader.read()
    if (done) break
    buffer += decoder.decode(value, { stream: true })
    for (const block of buffer.split('\\n\\n')) {
      if (!block.trim().startsWith('event:')) continue
      const name = /event: (.+)/.exec(block)?.[1]
      const data = /data: (.+)/.exec(block)?.[1]
      if (!data) continue
      const payload = JSON.parse(data)
      if (name === 'session') {
        current = payload.session
        const event = payload.event
        if (event.type === 'assistant/chunk' && event.chunk.type === 'text-delta') add('assistant', event.chunk.text)
        else if (event.type === 'assistant/chunk' && event.chunk.type === 'reasoning-delta') add('reasoning', event.chunk.text)
      } else if (name === 'done') {
        for (const denial of payload.denials ?? []) add('denied', denial.tool + ': ' + denial.message)
        document.getElementById('views').addEventListener('click', (clickEvent) => {
  const button = clickEvent.target.closest('button[data-view]')
  if (button) showView(button.dataset.view)
})

/**
 * The view ring switches what the right pane shows, on the session already selected.
 *
 * The handler is registered here rather than inline so the markup carries no behaviour, and `refreshSessions`
 * runs once at the end to open the newest session in whichever view is current.
 */
document.getElementById('views').addEventListener('click', (clickEvent) => {
  const button = clickEvent.target.closest('button[data-view]')
  if (button) showView(button.dataset.view)
})

refreshSessions()
      } else if (name === 'error') add('denied', payload.message)
    }
    const lastBreak = buffer.lastIndexOf('\\n\\n')
    if (lastBreak !== -1) buffer = buffer.slice(lastBreak + 2)
  }
})

document.getElementById('views').addEventListener('click', (clickEvent) => {
  const button = clickEvent.target.closest('button[data-view]')
  if (button) showView(button.dataset.view)
})

/**
 * The view ring switches what the right pane shows, on the session already selected.
 *
 * The handler is registered here rather than inline so the markup carries no behaviour, and `refreshSessions`
 * runs once at the end to open the newest session in whichever view is current.
 */
document.getElementById('views').addEventListener('click', (clickEvent) => {
  const button = clickEvent.target.closest('button[data-view]')
  if (button) showView(button.dataset.view)
})

refreshSessions()
</script>
</body>
</html>
